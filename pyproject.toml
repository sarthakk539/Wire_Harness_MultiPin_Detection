[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "wire-harness-detector"
version = "1.0.0"
description = "Advanced multi-pin (24+) wire harness color detection using BFS"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Sarthak Prajapati"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[project.urls]
Homepage = "https://github.com/sarthakk539/Wire_Harness_MultiPin_Detection"
Repository = "https://github.com/sarthakk539/Wire_Harness_MultiPin_Detection.git"

[project.scripts]
wire-harness = "app:main"
